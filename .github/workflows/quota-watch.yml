name: 标普500场外额度监控

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC。北京时间 = UTC + 8
    # 周一到周五，交易时段内密集检测（北京时间 9:20-15:00）
    - cron: '20 1 * * 1-5'   # 9:20
    - cron: '40 1 * * 1-5'   # 9:40
    - cron: '0 2 * * 1-5'    # 10:00
    - cron: '20 2 * * 1-5'   # 10:20
    - cron: '40 2 * * 1-5'   # 10:40
    - cron: '0 3 * * 1-5'    # 11:00
    - cron: '20 3 * * 1-5'   # 11:20
    - cron: '40 3 * * 1-5'   # 11:40
    - cron: '0 4 * * 1-5'    # 12:00
    - cron: '20 4 * * 1-5'   # 12:20
    - cron: '40 4 * * 1-5'   # 12:40
    - cron: '0 5 * * 1-5'    # 13:00
    - cron: '20 5 * * 1-5'   # 13:20
    - cron: '40 5 * * 1-5'   # 13:40
    - cron: '0 6 * * 1-5'    # 14:00
    - cron: '20 6 * * 1-5'   # 14:20
    - cron: '40 6 * * 1-5'   # 14:40
    # 周一到周四，北京 15:30（交易日前一天下午查询，确保次日早上有最新数据）
    - cron: '30 7 * * 1-4'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'print'
        type: choice
        options:
          - print          # 只打印当前额度表，不推送
          - init           # 重建基线快照

permissions:
  contents: write

concurrency:
  group: sp500-quota-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 恢复历史快照
        # 快照已提交在仓库 data/state.json 里，检出即恢复；此步兜底
        run: |
          mkdir -p data
          [ -f data/state.json ] && echo "已有快照：$(cat data/state.json | head -c 120)" || echo "无快照，本次将建立基线"

      - name: 运行监控
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TZ: Asia/Shanghai
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.mode }}" in
              print)        python3 sp500_quota_watch.py --print ;;
              init)         python3 sp500_quota_watch.py --init ;;
            esac
          else
            # 常规检测：只在额度变动时推送
            python3 sp500_quota_watch.py
          fi

      - name: 回写快照到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新额度快照 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "推送失败，下次运行会自行纠正"
          fi
